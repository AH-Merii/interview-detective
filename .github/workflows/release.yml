name: Release

on:
  push:
    branches: [main]

permissions: {}

# One release run at a time, so two quick merges can't race on the release PR.
concurrency:
  group: release
  cancel-in-progress: false

# release-please reads the Conventional Commit titles merged to main and keeps one release PR open that bumps
# version.txt and CHANGELOG.md. The PR merges itself once ci-ok passes; that push runs this again, which tags vX.Y.Z
# and publishes the GitHub release. Settings are in release-please-config.json. Modelled on neoblocks.nvim's.

jobs:
  release-please:
    name: Release PR, auto-merge and tags
    # Everything goes through the App's token below, so GITHUB_TOKEN gets nothing.
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The release PR is opened and merged as the interview-detective-bot App. GitHub holds CI on a PR opened with
      # GITHUB_TOKEN until someone approves it
      # (github.blog/changelog/2026-06-11-bot-created-pull-requests-can-run-workflows-if-approved), and a merge
      # pushed with GITHUB_TOKEN would not run this workflow to tag the release.
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write # push the release branch, tags and GitHub releases; merge the release PR
          permission-issues: write # label the release PR (labels go through the issues API)
          permission-pull-requests: write # open, update and auto-merge the release PR
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}
      # Squash-merges once the main ruleset's required check (ci-ok) passes on it.
      - name: Merge the release PR when CI passes
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ fromJSON(steps.release.outputs.pr).number }}
          REPO: ${{ github.repository }}
        run: gh pr merge "$PR" --repo "$REPO" --auto --squash
